modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/imbavirus/infernos-dragon-eyes/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/imbavirus/infernos-dragon-eyes"
logoFile = "logo.png"
credits = "Based on Eyes of Ice and Fire CE (LucianoWayand, Groupix05) / Eye of Dragons lineage. Distinct Infernos port for 1.21.1 NeoForge — not affiliated with upstream."
authors = "${mod_authors}"
description = """${mod_description}"""

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "iceandfire"
type = "required"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"
