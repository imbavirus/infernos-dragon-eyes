modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/imbavirus/eyes-of-ice-and-fire/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/imbavirus/eyes-of-ice-and-fire"
logoFile = "logo.png"
credits = "Original Eyes of Dragons by MKuckert; 1.20 Eyes of Ice and Fire by LucianoWayand; CE fork by Groupix05; 1.21.1 NeoForge port by Infernos/Imbavirus."
authors = "${mod_authors}"
description = """${mod_description}"""

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "iceandfire"
type = "required"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"
